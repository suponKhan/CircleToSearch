name: Build Personal APK (suponKhan)

on:
  workflow_dispatch:
    inputs:
      bubble_size:
        description: 'Bubble size in px (20-200, default: 40)'
        required: false
        default: '40'
        type: string
      bubble_opacity:
        description: 'Bubble opacity 0-100 (0=fully opaque, default: 0)'
        required: false
        default: '0'
        type: string

env:
  BUBBLE_SIZE_DEFAULT: ${{ inputs.bubble_size || '40' }}
  BUBBLE_OPACITY_DEFAULT: ${{ inputs.bubble_opacity || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Patch BubblePreferences.kt defaults
        run: |
          BUBBLE_FILE="app/src/main/java/com/akslabs/circletosearch/utils/BubblePreferences.kt"
          sed -i \
            -e "s/const val DEFAULT_BUBBLE_SIZE = [0-9]*/const val DEFAULT_BUBBLE_SIZE = ${{ env.BUBBLE_SIZE_DEFAULT }}/" \
            -e "s/const val DEFAULT_TRANSPARENCY = [0-9]*/const val DEFAULT_TRANSPARENCY = ${{ env.BUBBLE_OPACITY_DEFAULT }}/" \
            "$BUBBLE_FILE"

          echo "=== Bubble constants after patch ==="
          grep -E "DEFAULT_BUBBLE_SIZE|DEFAULT_TRANSPARENCY|MIN_BUBBLE_SIZE|MAX_BUBBLE_SIZE" "$BUBBLE_FILE"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-bubble-${{ env.BUBBLE_SIZE_DEFAULT }}px-op${{ env.BUBBLE_OPACITY_DEFAULT }}
          path: |
            app/build/outputs/apk/debug/*-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-unsigned-bubble-${{ env.BUBBLE_SIZE_DEFAULT }}px-op${{ env.BUBBLE_OPACITY_DEFAULT }}
          path: |
            app/build/outputs/apk/release/*-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: personal-${{ env.BUBBLE_SIZE_DEFAULT }}px-op${{ env.BUBBLE_OPACITY_DEFAULT }}-${{ github.run_number }}
          body: |
            ## CircleToSearch Personal Build

            | Setting | Value |
            |---|---|
            | Bubble size | ${{ env.BUBBLE_SIZE_DEFAULT }} px |
            | Bubble opacity | ${{ env.BUBBLE_OPACITY_DEFAULT }}% (0 = fully opaque) |
            | Commit | ${{ github.sha }} |

            - **Debug APK**: installable directly (self-signed debug key)
            - **Release APK**: unsigned (re-sign with `apksigner` before installing)
          files: |
            app/build/outputs/apk/debug/*-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*-release-unsigned.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
